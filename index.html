<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="description" content="Тренажёр азбуки Морзе по напевам: изучение, приём на слух, передача ключом.">
  <title>Морзянка по напевам</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Событие установки может прийти раньше модулей: сохраняем его до загрузки js/install.js.
    addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });
  </script>
</head>
<body>
  <header class="top">
    <span class="logo">·–</span>
    <h1>Морзянка по напевам</h1>
  </header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs">
    <button class="tab" data-tab="learn"><span>♪</span>Учить</button>
    <button class="tab" data-tab="rx"><span>◉</span>Приём</button>
    <button class="tab" data-tab="tx"><span>▬</span>Передача</button>
    <button class="tab" data-tab="groups"><span>⁙</span>Группы</button>
    <button class="tab" data-tab="progress"><span>▦</span>Прогресс</button>
  </nav>
  <noscript>Для работы тренажёра нужен JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
